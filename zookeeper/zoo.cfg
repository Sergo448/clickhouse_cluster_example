tickTime=2000
initLimit=10
syncLimit=5
dataDir=/data
dataLogDir=/datalog
clientPort=2181
maxClientCnxns=30
autopurge.snapRetainCount=3
autopurge.purgeInterval=1
# Limit snapshot/log sizes for lower memory usage
preAllocSize=32768
snapCount=50000
# Reduce session tracking overhead
globalOutstandingLimit=100
