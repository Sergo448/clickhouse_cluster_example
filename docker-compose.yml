services:
  zk-01:
    image: zookeeper:3.8
    container_name: zk-01
    hostname: zk-01
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_STANDALONE_ENABLED: "true"
      ZOO_JVMFLAGS: "-Xms64m -Xmx128m -XX:+UseG1GC"
    volumes:
      - zk-01-data:/data
      - zk-01-datalog:/datalog
      - ./zookeeper/zoo.cfg:/conf/zoo.cfg
    networks:
      - clickhouse-net
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    restart: unless-stopped

  clickhouse-01:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse-01
    hostname: clickhouse-01
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ch-01-data:/var/lib/clickhouse
      - ch-01-logs:/var/log/clickhouse-server
      - ./clickhouse/config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - ./clickhouse/config.d/macros-node1.xml:/etc/clickhouse-server/config.d/macros.xml
      - ./clickhouse/config.d/resource-limits.xml:/etc/clickhouse-server/config.d/resource-limits.xml
      - ./clickhouse/users.d/users.xml:/etc/clickhouse-server/users.d/users.xml
    depends_on:
      - zk-01
    networks:
      - clickhouse-net
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G
        reservations:
          cpus: "0.20"
          memory: 256M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

  clickhouse-02:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse-02
    hostname: clickhouse-02
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - ch-02-data:/var/lib/clickhouse
      - ch-02-logs:/var/log/clickhouse-server
      - ./clickhouse/config.d/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - ./clickhouse/config.d/macros-node2.xml:/etc/clickhouse-server/config.d/macros.xml
      - ./clickhouse/config.d/resource-limits.xml:/etc/clickhouse-server/config.d/resource-limits.xml
      - ./clickhouse/users.d/users.xml:/etc/clickhouse-server/users.d/users.xml
    depends_on:
      - zk-01
    networks:
      - clickhouse-net
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G
        reservations:
          cpus: "0.20"
          memory: 256M
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

volumes:
  zk-01-data:
  zk-01-datalog:
  ch-01-data:
  ch-01-logs:
  ch-02-data:
  ch-02-logs:

networks:
  clickhouse-net:
    driver: bridge
